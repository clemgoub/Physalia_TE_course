<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 462" width="960" height="462" role="img"><title>Example 3: a deletion in an alpha-satellite array, not a mobile element insertion</title><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a9a" stroke-width="1.2"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#57606a" stroke-width="1.6"/></marker></defs><rect width="960" height="462" fill="#ffffff"/><text x="20" y="30" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#24292f">Example 3: not an MEI, HG002.mat.svim_asm.DEL.83_330 (chr22:8,522,276)</text><text x="20" y="52" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#57606a">341 bp of alpha satellite (ALR/Alpha) missing from the maternal haplotype, inside a satellite array.</text><path d="M430,104 L430,96 L690,96 L690,104" fill="none" stroke="#57606a" stroke-width="1.2"/><text x="560.0" y="90" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#57606a">REF allele: 341 bp, about two units of the array</text><text x="20" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#24292f">Reference (CHM13)</text><polygon points="170,110 300,110 300,136 170,136" fill="#d9d9d9" stroke="#6b6b6b" stroke-width="1.2"/><polygon points="170,110 300,110 300,136 170,136" fill="url(#hatch)" stroke="none"/><polygon points="300,110 430,110 430,136 300,136" fill="#d9d9d9" stroke="#6b6b6b" stroke-width="1.2"/><polygon points="300,110 430,110 430,136 300,136" fill="url(#hatch)" stroke="none"/><polygon points="430,110 560,110 560,136 430,136" fill="#d9d9d9" stroke="#6b6b6b" stroke-width="1.2"/><polygon points="430,110 560,110 560,136 430,136" fill="url(#hatch)" stroke="none"/><text x="495.0" y="127.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#24292f">ALR/Alpha</text><polygon points="560,110 690,110 690,136 560,136" fill="#d9d9d9" stroke="#6b6b6b" stroke-width="1.2"/><polygon points="560,110 690,110 690,136 560,136" fill="url(#hatch)" stroke="none"/><text x="625.0" y="127.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#24292f">ALR/Alpha</text><polygon points="690,110 820,110 820,136 690,136" fill="#d9d9d9" stroke="#6b6b6b" stroke-width="1.2"/><polygon points="690,110 820,110 820,136 690,136" fill="url(#hatch)" stroke="none"/><polygon points="820,110 945,110 945,136 820,136" fill="#d9d9d9" stroke="#6b6b6b" stroke-width="1.2"/><polygon points="820,110 945,110 945,136 820,136" fill="url(#hatch)" stroke="none"/><text x="20" y="174" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#24292f">HG002 maternal</text><polygon points="170,156 300,156 300,182 170,182" fill="#d9d9d9" stroke="#6b6b6b" stroke-width="1.2"/><polygon points="170,156 300,156 300,182 170,182" fill="url(#hatch)" stroke="none"/><polygon points="300,156 430,156 430,182 300,182" fill="#d9d9d9" stroke="#6b6b6b" stroke-width="1.2"/><polygon points="300,156 430,156 430,182 300,182" fill="url(#hatch)" stroke="none"/><line x1="430" y1="169.0" x2="690" y2="169.0" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="690,156 820,156 820,182 690,182" fill="#d9d9d9" stroke="#6b6b6b" stroke-width="1.2"/><polygon points="690,156 820,156 820,182 690,182" fill="url(#hatch)" stroke="none"/><polygon points="820,156 945,156 945,182 820,182" fill="#d9d9d9" stroke="#6b6b6b" stroke-width="1.2"/><polygon points="820,156 945,156 945,182 820,182" fill="url(#hatch)" stroke="none"/><text x="20" y="220" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#24292f">HG002 paternal</text><polygon points="170,202 300,202 300,228 170,228" fill="#d9d9d9" stroke="#6b6b6b" stroke-width="1.2"/><polygon points="170,202 300,202 300,228 170,228" fill="url(#hatch)" stroke="none"/><polygon points="300,202 430,202 430,228 300,228" fill="#d9d9d9" stroke="#6b6b6b" stroke-width="1.2"/><polygon points="300,202 430,202 430,228 300,228" fill="url(#hatch)" stroke="none"/><polygon points="430,202 560,202 560,228 430,228" fill="#d9d9d9" stroke="#6b6b6b" stroke-width="1.2"/><polygon points="430,202 560,202 560,228 430,228" fill="url(#hatch)" stroke="none"/><text x="495.0" y="219.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#24292f">ALR/Alpha</text><polygon points="560,202 690,202 690,228 560,228" fill="#d9d9d9" stroke="#6b6b6b" stroke-width="1.2"/><polygon points="560,202 690,202 690,228 560,228" fill="url(#hatch)" stroke="none"/><text x="625.0" y="219.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#24292f">ALR/Alpha</text><polygon points="690,202 820,202 820,228 690,228" fill="#d9d9d9" stroke="#6b6b6b" stroke-width="1.2"/><polygon points="690,202 820,202 820,228 690,228" fill="url(#hatch)" stroke="none"/><polygon points="820,202 945,202 945,228 820,228" fill="#d9d9d9" stroke="#6b6b6b" stroke-width="1.2"/><polygon points="820,202 945,202 945,228 820,228" fill="url(#hatch)" stroke="none"/><text x="170" y="252" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#57606a">The same 341 bp occur 3.4 kb upstream and 3.4 kb downstream at 99–100% identity (blastn on the reference).</text><rect x="16" y="270" width="928" height="176" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text x="32" y="294" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#24292f">In tutorial/3_TSD_search/pangenome.vcf</text><text x="32" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#24292f" font-weight="bold">SVLEN=-341.0</tspan></text><text x="500" y="318" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">a deletion of 341 bp relative to the reference</text><text x="32" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#6b6b6b" font-weight="bold">repeat_ids=ALR/Alpha matching_classes=Satellite/centr</tspan></text><text x="500" y="340" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">RepeatMasker: centromeric alpha satellite, not a TE</text><text x="32" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#6b6b6b" font-weight="bold">RM_hit_strands=C match_lengths=339</tspan></text><text x="500" y="362" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">339 of the 341 bp match</text><text x="32" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#a87300" font-weight="bold">TSD=CAATCAA,CAATCAA</tspan></text><text x="500" y="384" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">the same 7 bp at both ends</text><text x="32" y="406" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#b5462f" font-weight="bold">polyA=FALSE</tspan></text><text x="500" y="406" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">no poly(A) tail</text><text x="32" y="428" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#24292f" font-weight="bold">HG002.mat  1/1   HG002.pat  0/0</tspan></text><text x="500" y="428" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">missing from the maternal assembly only</text></svg>