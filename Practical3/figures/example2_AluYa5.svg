<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img"><title>Example 2: an AluYa5 insertion present in both HG002 assemblies</title><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a9a" stroke-width="1.2"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#57606a" stroke-width="1.6"/></marker></defs><rect width="960" height="680" fill="#ffffff"/><text x="20" y="30" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#24292f">Example 2: AluYa5 insertion, HG002.mat.svim_asm.INS.182_786 (chr22:25,461,790)</text><text x="20" y="52" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#57606a">An AluYa5 on the minus strand, absent from the reference and present in both HG002 assemblies, inserted in a run of T.</text><path d="M300,104 L300,96 L680,96 L680,104" fill="none" stroke="#57606a" stroke-width="1.2"/><text x="490.0" y="90" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#57606a">ALT allele: 297 bp present in HG002, absent from the reference</text><text x="20" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#24292f">Reference (CHM13)</text><polygon points="170,110 300,110 300,136 170,136" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><text x="235.0" y="127.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#24292f">…CCTGTTTTTTTTTTT</text><line x1="300" y1="123.0" x2="680" y2="123.0" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="680,110 800,110 800,136 680,136" fill="#ffd27a" stroke="#a87300" stroke-width="1.2"/><text x="740.0" y="127.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#24292f">T×18</text><polygon points="800,110 945,110 945,136 800,136" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><text x="872.5" y="127.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#24292f">AAATGTAG…</text><text x="20" y="174" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#24292f">HG002 maternal</text><polygon points="170,156 300,156 300,182 170,182" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><text x="235.0" y="173.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#24292f">…CCTGTTTTTTTTTTT</text><polygon points="300,156 380,156 380,182 300,182" fill="#f7b8aa" stroke="#b5462f" stroke-width="1.2"/><text x="340.0" y="173.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#24292f">T×17</text><polygon points="389,156 680,156 680,182 389,182 380,169.0" fill="#9fdccf" stroke="#1f7a6f" stroke-width="1.2"/><text x="530.0" y="173.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#24292f">AluYa5  (− strand)</text><polygon points="680,156 800,156 800,182 680,182" fill="#ffd27a" stroke="#a87300" stroke-width="1.2"/><text x="740.0" y="173.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#24292f">T×18</text><polygon points="800,156 945,156 945,182 800,182" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><text x="872.5" y="173.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#24292f">AAATGTAG…</text><text x="20" y="220" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#24292f">HG002 paternal</text><polygon points="170,202 300,202 300,228 170,228" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><text x="235.0" y="219.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#24292f">…CCTGTTTTTTTTTTT</text><polygon points="300,202 380,202 380,228 300,228" fill="#f7b8aa" stroke="#b5462f" stroke-width="1.2"/><text x="340.0" y="219.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#24292f">T×17</text><polygon points="389,202 680,202 680,228 389,228 380,215.0" fill="#9fdccf" stroke="#1f7a6f" stroke-width="1.2"/><text x="530.0" y="219.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#24292f">AluYa5  (− strand)</text><polygon points="680,202 800,202 800,228 680,228" fill="#ffd27a" stroke="#a87300" stroke-width="1.2"/><text x="740.0" y="219.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#24292f">T×18</text><polygon points="800,202 945,202 945,228 800,228" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><text x="872.5" y="219.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#24292f">AAATGTAG…</text><text x="170" y="252" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#57606a">On the + strand, the Alu&#x27;s tail is a run of T, and it sits next to a run of T in the reference.</text><text x="170" y="268" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#57606a">The TSD that GraffiTE found (18 T) overlaps the tail.</text><text x="20" y="298" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#24292f">Step 4: the reads on each path of the graph</text><polygon points="20,376 100,376 100,402 20,402" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><polygon points="350,376 430,376 430,402 350,402" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><path d="M100,389 C130,346 160,346 180,346" fill="none" stroke="#1f7a6f" stroke-width="2"/><polygon points="180,334 270,334 270,360 180,360" fill="#9fdccf" stroke="#1f7a6f" stroke-width="1.2"/><text x="225.0" y="351.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#24292f">AluYa5</text><path d="M270,346 C290,346 320,346 350,389" fill="none" stroke="#1f7a6f" stroke-width="2"/><path d="M100,389 C150,436 300,436 350,389" fill="none" stroke="#57606a" stroke-width="2"/><line x1="190" y1="324" x2="255" y2="324" stroke="#24292f" stroke-width="2.5"/><line x1="180" y1="432" x2="245" y2="432" stroke="#24292f" stroke-width="2.5"/><text x="445" y="350" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#24292f">path with the TE: 1 read</text><text x="445" y="440" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#24292f">path without the TE: 1 read</text><text x="445" y="396" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#24292f">The TE path is the alternative allele (1): GT=0/1</text><rect x="16" y="466" width="928" height="198" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text x="32" y="490" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#24292f">In tutorial/4_Genotyping/GraffiTE.merged.genotypes.vcf.gz (last line: tutorial/1_SV_search/SVs.vcf)</text><text x="32" y="514" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#24292f" font-weight="bold">SVLEN=297</tspan></text><text x="500" y="514" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">positive: an insertion relative to the reference</text><text x="32" y="536" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#1f7a6f" font-weight="bold">repeat_ids=AluYa5 matching_classes=SINE/Alu</tspan></text><text x="500" y="536" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">RepeatMasker: one AluYa5 (n_hits=1)</text><text x="32" y="558" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#1f7a6f" font-weight="bold">RM_hit_strands=C match_lengths=296</tspan></text><text x="500" y="558" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">on the minus strand; 296 bp match</text><text x="32" y="580" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#a87300" font-weight="bold">TSD=TTTTTTTTTTTTTTTTTT,TTTTTTTTTTTTTTTTTT</tspan></text><text x="500" y="580" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">18 T on both sides</text><text x="32" y="602" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#b5462f" font-weight="bold">polyA=TRUE</tspan></text><text x="500" y="602" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">the tail, here the run of T</text><text x="32" y="624" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#24292f" font-weight="bold">GT:DP:AD  0/1:2:1,1</tspan></text><text x="500" y="624" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">only 2 reads, one per path: heterozygous call</text><text x="32" y="646" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#24292f" font-weight="normal">SVs.vcf: HG002.mat 1/1  HG002.pat 1/1</tspan></text><text x="500" y="646" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">both assemblies carry the insertion</text></svg>