<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 498" width="960" height="498" role="img"><title>DEL.71_275: an AluYb8 present in the reference and absent from both HG002 haplotypes</title><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a9a" stroke-width="1.2"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#57606a" stroke-width="1.6"/></marker></defs><rect width="960" height="498" fill="#ffffff"/><text x="20" y="30" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#24292f">One variant through the steps: HG002.mat.svim_asm.DEL.71_275 (chr22:5,912,711)</text><text x="20" y="52" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#57606a">An AluYb8 in the reference genome, with its target site duplication (TSD) and poly(A) tail. Both HG002 haplotypes lack it.</text><path d="M260,104 L260,96 L750,96 L750,104" fill="none" stroke="#57606a" stroke-width="1.2"/><text x="505.0" y="90" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#57606a">REF allele: 327 bp missing from HG002 (plus the base before it, at POS)</text><text x="20" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#24292f">Reference (CHM13)</text><polygon points="170,110 260,110 260,136 170,136" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><text x="215.0" y="127.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#24292f">…TTTTTCA</text><polygon points="260,110 370,110 370,136 260,136" fill="#ffd27a" stroke="#a87300" stroke-width="1.2"/><text x="315.0" y="127.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#24292f">AAGAAAATTAGTG</text><polygon points="370,110 681,110 690,123.0 681,136 370,136" fill="#9fdccf" stroke="#1f7a6f" stroke-width="1.2"/><text x="530.0" y="127.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#24292f">AluYb8  (+ strand)</text><polygon points="690,110 750,110 750,136 690,136" fill="#f7b8aa" stroke="#b5462f" stroke-width="1.2"/><text x="720.0" y="127.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#24292f">A×24</text><polygon points="750,110 860,110 860,136 750,136" fill="#ffd27a" stroke="#a87300" stroke-width="1.2"/><text x="805.0" y="127.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#24292f">AAGAAAATTAGTG</text><polygon points="860,110 945,110 945,136 860,136" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><text x="902.5" y="127.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#24292f">TTCCTT…</text><text x="20" y="174" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#24292f">HG002 maternal</text><polygon points="170,156 260,156 260,182 170,182" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><text x="215.0" y="173.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#24292f">…TTTTTCA</text><line x1="260" y1="169.0" x2="750" y2="169.0" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="750,156 860,156 860,182 750,182" fill="#ffd27a" stroke="#a87300" stroke-width="1.2"/><text x="805.0" y="173.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#24292f">AAGAAAATTAGTG</text><polygon points="860,156 945,156 945,182 860,182" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><text x="902.5" y="173.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#24292f">TTCCTT…</text><text x="20" y="220" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#24292f">HG002 paternal</text><polygon points="170,202 260,202 260,228 170,228" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><text x="215.0" y="219.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#24292f">…TTTTTCA</text><line x1="260" y1="215.0" x2="750" y2="215.0" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="750,202 860,202 860,228 750,228" fill="#ffd27a" stroke="#a87300" stroke-width="1.2"/><text x="805.0" y="219.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#24292f">AAGAAAATTAGTG</text><polygon points="860,202 945,202 945,228 860,228" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><text x="902.5" y="219.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#24292f">TTCCTT…</text><text x="505" y="240" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#57606a">one TSD copy left: the empty site</text><rect x="16" y="262" width="928" height="220" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text x="32" y="286" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#24292f">In tutorial/3_TSD_search/pangenome.vcf</text><text x="32" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#24292f" font-weight="normal">REF=</tspan><tspan fill="#57606a" font-weight="normal">T</tspan><tspan fill="#a87300" font-weight="bold">AAGAAAATTAGTG</tspan><tspan fill="#1f7a6f" font-weight="bold">GGCC…</tspan><tspan fill="#b5462f" font-weight="bold">AAAA</tspan><tspan fill="#24292f" font-weight="normal">  ALT=T</tspan></text><text x="500" y="310" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">REF is the reference sequence (328 bp), ALT what HG002 has</text><text x="32" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#24292f" font-weight="bold">SVLEN=-327</tspan></text><text x="500" y="332" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">negative: a deletion relative to the reference</text><text x="32" y="354" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#1f7a6f" font-weight="bold">repeat_ids=AluYb8 matching_classes=SINE/Alu</tspan></text><text x="500" y="354" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">RepeatMasker: one AluYb8 (n_hits=1)</text><text x="32" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#1f7a6f" font-weight="bold">RM_hit_strands=+ match_lengths=322</tspan></text><text x="500" y="376" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">on the + strand; 322 bp of the variant match the Alu</text><text x="32" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#a87300" font-weight="bold">TSD=AAGAAAATTAGTG,AAGAAAATTAGTG</tspan></text><text x="500" y="398" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">the same 13 bp on both sides of the element</text><text x="32" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#b5462f" font-weight="bold">polyA=TRUE</tspan></text><text x="500" y="420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">a poly(A) tail at the 3&#x27; end of the Alu</text><text x="32" y="442" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#24292f" font-weight="normal">total_repeat_span=0.987805 ULTRA_TR=23</tspan></text><text x="500" y="442" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">99% of the variant is repeat; 23 bp of tandem repeat</text><text x="32" y="464" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#24292f" font-weight="bold">HG002.mat  1/1   HG002.pat  1/1</tspan></text><text x="500" y="464" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">the deletion is in both assemblies</text></svg>