<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 704" width="960" height="704" role="img"><title>Example 1: an L1HS 3&#x27; end deleted from the paternal HG002 haplotype</title><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a9a" stroke-width="1.2"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#57606a" stroke-width="1.6"/></marker></defs><rect width="960" height="704" fill="#ffffff"/><text x="20" y="30" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#24292f">Example 1: L1HS deletion, HG002.pat.svim_asm.DEL.140_387 (chr22:11,244,543)</text><text x="20" y="52" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#57606a">The 3&#x27; end of an L1HS, on the minus strand, in the reference. The paternal haplotype lacks it; the maternal one has it.</text><text x="170" y="84" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#57606a">Full-length L1HS consensus, 6,155 bp:</text><polygon points="400,72 900,72 900,90 400,90" fill="#ffffff" stroke="#9aa3ad" stroke-width="1.2"/><text x="650.0" y="85.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#24292f">5&#x27; UTR · ORF1 · ORF2 · 3&#x27; UTR</text><rect x="892" y="72" width="8" height="18" fill="#cdbdf2" stroke="#5b3fa8" stroke-width="1.2"/><text x="896" y="106" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="end" font-weight="normal" fill="#57606a">positions 6,053–6,155: the part present here</text><path d="M260,144 L260,136 L750,136 L750,144" fill="none" stroke="#57606a" stroke-width="1.2"/><text x="505.0" y="130" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#57606a">REF allele: 138 bp missing from the paternal haplotype</text><text x="20" y="168" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#24292f">Reference (CHM13)</text><polygon points="170,150 260,150 260,176 170,176" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><text x="215.0" y="167.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#24292f">…ACATGAA</text><polygon points="260,150 360,150 360,176 260,176" fill="#ffd27a" stroke="#a87300" stroke-width="1.2"/><text x="310.0" y="167.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#24292f">TATTGCCTTTT</text><polygon points="360,150 470,150 470,176 360,176" fill="#f7b8aa" stroke="#b5462f" stroke-width="1.2"/><text x="415.0" y="167.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#24292f">T×42</text><polygon points="479,150 750,150 750,176 479,176 470,163.0" fill="#cdbdf2" stroke="#5b3fa8" stroke-width="1.2"/><text x="610.0" y="167.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#24292f">L1HS 3&#x27; end  (− strand)</text><polygon points="750,150 850,150 850,176 750,176" fill="#ffd27a" stroke="#a87300" stroke-width="1.2"/><text x="800.0" y="167.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#24292f">TATTGCCTTTT</text><polygon points="850,150 945,150 945,176 850,176" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><text x="897.5" y="167.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#24292f">AACAAAT…</text><text x="20" y="214" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#24292f">HG002 maternal</text><polygon points="170,196 260,196 260,222 170,222" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><text x="215.0" y="213.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#24292f">…ACATGAA</text><polygon points="260,196 360,196 360,222 260,222" fill="#ffd27a" stroke="#a87300" stroke-width="1.2"/><text x="310.0" y="213.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#24292f">TATTGCCTTTT</text><polygon points="360,196 470,196 470,222 360,222" fill="#f7b8aa" stroke="#b5462f" stroke-width="1.2"/><text x="415.0" y="213.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#24292f">T×42</text><polygon points="479,196 750,196 750,222 479,222 470,209.0" fill="#cdbdf2" stroke="#5b3fa8" stroke-width="1.2"/><text x="610.0" y="213.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#24292f">L1HS 3&#x27; end  (− strand)</text><polygon points="750,196 850,196 850,222 750,222" fill="#ffd27a" stroke="#a87300" stroke-width="1.2"/><text x="800.0" y="213.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#24292f">TATTGCCTTTT</text><polygon points="850,196 945,196 945,222 850,222" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><text x="897.5" y="213.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#24292f">AACAAAT…</text><text x="20" y="260" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#24292f">HG002 paternal</text><polygon points="170,242 260,242 260,268 170,268" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><text x="215.0" y="259.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#24292f">…ACATGAA</text><line x1="260" y1="255.0" x2="750" y2="255.0" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="750,242 850,242 850,268 750,268" fill="#ffd27a" stroke="#a87300" stroke-width="1.2"/><text x="800.0" y="259.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#24292f">TATTGCCTTTT</text><polygon points="850,242 945,242 945,268 850,268" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><text x="897.5" y="259.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#24292f">AACAAAT…</text><text x="170" y="292" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#57606a">On the minus strand, the poly(A) tail reads as a run of T on the + strand, at the left end.</text><text x="20" y="322" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#24292f">Step 4: the reads on each path of the graph</text><polygon points="20,400 100,400 100,426 20,426" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><polygon points="350,400 430,400 430,426 350,426" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><path d="M100,413 C130,370 160,370 180,370" fill="none" stroke="#5b3fa8" stroke-width="2"/><polygon points="180,358 270,358 270,384 180,384" fill="#cdbdf2" stroke="#5b3fa8" stroke-width="1.2"/><text x="225.0" y="375.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#24292f">L1HS</text><path d="M270,370 C290,370 320,370 350,413" fill="none" stroke="#5b3fa8" stroke-width="2"/><path d="M100,413 C150,460 300,460 350,413" fill="none" stroke="#57606a" stroke-width="2"/><line x1="190" y1="348" x2="255" y2="348" stroke="#24292f" stroke-width="2.5"/><line x1="202" y1="341" x2="267" y2="341" stroke="#24292f" stroke-width="2.5"/><line x1="180" y1="456" x2="245" y2="456" stroke="#24292f" stroke-width="2.5"/><line x1="192" y1="463" x2="257" y2="463" stroke="#24292f" stroke-width="2.5"/><text x="445" y="374" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#24292f">path with the TE: 2 reads</text><text x="445" y="464" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#24292f">path without the TE: 2 reads</text><text x="445" y="420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#24292f">The TE path is the reference (0): GT=1/0</text><rect x="16" y="490" width="928" height="198" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text x="32" y="514" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#24292f">In tutorial/4_Genotyping/GraffiTE.merged.genotypes.vcf.gz</text><text x="32" y="538" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#24292f" font-weight="bold">SVLEN=-138</tspan></text><text x="500" y="538" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">a deletion of 138 bp relative to the reference</text><text x="32" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#5b3fa8" font-weight="bold">repeat_ids=L1HS matching_classes=LINE/L1</tspan></text><text x="500" y="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">RepeatMasker: one L1HS (n_hits=1)</text><text x="32" y="582" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#5b3fa8" font-weight="bold">RM_hit_strands=C match_lengths=130</tspan></text><text x="500" y="582" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">C = complementary (minus) strand; 130 bp match</text><text x="32" y="604" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#a87300" font-weight="bold">TSD=TATTGCCTTTT,TATTGCCTTTT</tspan></text><text x="500" y="604" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">the same 11 bp on both sides</text><text x="32" y="626" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#b5462f" font-weight="bold">polyA=TRUE</tspan></text><text x="500" y="626" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">the tail, here the run of T</text><text x="32" y="648" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#24292f" font-weight="normal">ULTRA_TR=47 ULTRA_TR_span=0.338129</tspan></text><text x="500" y="648" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">47 bp of tandem repeat, mostly the run of T</text><text x="32" y="670" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#24292f" xml:space="preserve"><tspan fill="#24292f" font-weight="bold">GT:DP:AD  1/0:4:2,2</tspan></text><text x="500" y="670" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">4 reads: 2 on each path, so heterozygous</text></svg>