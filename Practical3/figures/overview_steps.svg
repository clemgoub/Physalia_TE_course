<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img"><title>GraffiTE in four steps: compare, keep the repeats, check the hallmarks, genotype</title><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a9a" stroke-width="1.2"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#57606a" stroke-width="1.6"/></marker></defs><rect width="960" height="600" fill="#ffffff"/><text x="20" y="30" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#24292f">What GraffiTE does, in four steps</text><rect x="20" y="60" width="450" height="250" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="36" y="88" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#24292f">1. Compare each assembly to the reference</text><rect x="490" y="60" width="450" height="250" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="506" y="88" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#24292f">2. Keep the differences made of repeats</text><rect x="20" y="330" width="450" height="250" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="36" y="358" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#24292f">3. Look for the signs of a transposition</text><rect x="490" y="330" width="450" height="250" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="506" y="358" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#24292f">4. Genotype with short reads on a graph</text><text x="36" y="134" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#57606a">reference</text><polygon points="120,120 210,120 210,140 120,140" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><polygon points="210,120 280,120 280,140 210,140" fill="#ffffff" stroke="#9aa3ad" stroke-width="1.2"/><text x="245.0" y="134.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#24292f">DEL</text><polygon points="280,120 450,120 450,140 280,140" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><path d="M360,144 l-6,9 l12,0 z" fill="#57606a"/><text x="36" y="204" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#57606a">assembly</text><polygon points="120,190 210,190 210,210 120,210" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><line x1="210" y1="200.0" x2="280" y2="200.0" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="280,190 360,190 360,210 280,210" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><polygon points="360,190 420,190 420,210 360,210" fill="#ffffff" stroke="#9aa3ad" stroke-width="1.2"/><text x="390.0" y="204.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#24292f">INS</text><polygon points="420,190 450,190 450,210 420,210" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><text x="245" y="232" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#57606a">DEL: only in the reference</text><text x="390" y="232" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#57606a">INS: only in the assembly</text><text x="36" y="285" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#57606a">Each insertion (INS) and deletion (DEL) is a candidate.</text><polygon points="510,116 690,116 690,142 510,142" fill="#9fdccf" stroke="#1f7a6f" stroke-width="1.2"/><text x="600.0" y="133.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#24292f">TE</text><text x="710" y="134" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#24292f">kept</text><polygon points="510,166 690,166 690,192 510,192" fill="#d9d9d9" stroke="#6b6b6b" stroke-width="1.2"/><polygon points="510,166 690,166 690,192 510,192" fill="url(#hatch)" stroke="none"/><text x="600.0" y="183.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#24292f">satellite</text><text x="710" y="184" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#24292f">kept (filtered later)</text><polygon points="510,216 690,216 690,242 510,242" fill="#ffffff" stroke="#9aa3ad" stroke-width="1.2"/><text x="600.0" y="233.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#24292f">unique sequence</text><text x="710" y="234" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#57606a">dropped</text><text x="506" y="285" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#57606a">RepeatMasker labels each candidate with the TE library.</text><polygon points="50,420 100,420 100,446 50,446" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><polygon points="100,420 160,420 160,446 100,446" fill="#ffd27a" stroke="#a87300" stroke-width="1.2"/><text x="130.0" y="437.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#24292f">TSD</text><polygon points="160,420 311,420 320,433.0 311,446 160,446" fill="#9fdccf" stroke="#1f7a6f" stroke-width="1.2"/><text x="240.0" y="437.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#24292f">TE</text><polygon points="320,420 370,420 370,446 320,446" fill="#f7b8aa" stroke="#b5462f" stroke-width="1.2"/><text x="345.0" y="437.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#24292f">AAAA</text><polygon points="370,420 430,420 430,446 370,446" fill="#ffd27a" stroke="#a87300" stroke-width="1.2"/><text x="400.0" y="437.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#24292f">TSD</text><polygon points="430,420 450,420 450,446 430,446" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><text x="130" y="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#57606a">same short sequence</text><text x="400" y="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#57606a">on both sides</text><text x="345" y="410" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#57606a">poly(A) tail</text><text x="36" y="530" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#57606a">A target site duplication (TSD) and, for Alu, L1 and SVA,</text><text x="36" y="548" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#57606a">a poly(A) tail are left behind by the insertion.</text><polygon points="510,440 590,440 590,462 510,462" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><polygon points="840,440 920,440 920,462 840,462" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><path d="M590,451 C620,410 650,410 675,410" fill="none" stroke="#1f7a6f" stroke-width="2"/><polygon points="675,399 755,399 755,421 675,421" fill="#9fdccf" stroke="#1f7a6f" stroke-width="1.2"/><text x="715.0" y="414.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#24292f">TE</text><path d="M755,410 C780,410 810,410 840,451" fill="none" stroke="#1f7a6f" stroke-width="2"/><path d="M590,451 C640,495 790,495 840,451" fill="none" stroke="#57606a" stroke-width="2"/><line x1="680" y1="390" x2="740" y2="390" stroke="#24292f" stroke-width="2.5"/><line x1="680" y1="490" x2="740" y2="490" stroke="#24292f" stroke-width="2.5"/><line x1="690" y1="383" x2="750" y2="383" stroke="#24292f" stroke-width="2.5"/><line x1="690" y1="497" x2="750" y2="497" stroke="#24292f" stroke-width="2.5"/><text x="765" y="390" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#57606a">reads with the TE</text><text x="765" y="498" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#57606a">reads without</text><text x="506" y="555" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#57606a">2 reads on each path: one copy with the TE, one without (0/1).</text></svg>