<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" role="img"><title>What short reads show at a TE insertion: discordant read pairs and split reads</title><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a9a" stroke-width="1.2"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#57606a" stroke-width="1.6"/></marker></defs><rect width="960" height="370" fill="#ffffff"/><text x="20" y="30" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#24292f">What short reads show at a TE insertion</text><rect x="20" y="50" width="450" height="300" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="36" y="78" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#24292f">TE in the sample, not in the reference</text><rect x="490" y="50" width="450" height="300" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="506" y="78" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#24292f">TE in the reference, not in the sample</text><text x="36" y="124" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#57606a">TE library</text><polygon points="130,110 360,110 360,128 130,128" fill="#9fdccf" stroke="#1f7a6f" stroke-width="1.2"/><text x="245.0" y="123.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#24292f">TE consensus</text><text x="36" y="243" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#57606a">reference</text><polygon points="110,230 450,230 450,248 110,248" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><line x1="245" y1="180" x2="245" y2="260" stroke="#b5462f" stroke-width="1.5" stroke-dasharray="4 3"/><text x="245" y="274" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#b5462f">insertion point</text><line x1="170" y1="220" x2="202" y2="220" stroke="#24292f" stroke-width="3"/><path d="M201,215 L208,220 L201,225 z" fill="#24292f"/><line x1="186" y1="102" x2="218" y2="102" stroke="#1f7a6f" stroke-width="3"/><path d="M187,97 L180,102 L187,107 z" fill="#1f7a6f"/><line x1="189" y1="216" x2="199" y2="106" stroke="#57606a" stroke-width="1.2" stroke-dasharray="2 3"/><line x1="288" y1="220" x2="320" y2="220" stroke="#24292f" stroke-width="3"/><path d="M289,215 L282,220 L289,225 z" fill="#24292f"/><line x1="270" y1="102" x2="302" y2="102" stroke="#1f7a6f" stroke-width="3"/><path d="M301,97 L308,102 L301,107 z" fill="#1f7a6f"/><line x1="301" y1="216" x2="289" y2="106" stroke="#57606a" stroke-width="1.2" stroke-dasharray="2 3"/><line x1="205" y1="196" x2="245" y2="196" stroke="#24292f" stroke-width="3"/><line x1="245" y1="196" x2="279" y2="172" stroke="#1f7a6f" stroke-width="3"/><text x="285" y="174" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#57606a">split read</text><text x="36" y="310" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#57606a">One read maps next to the insertion point and its mate matches</text><text x="36" y="328" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#57606a">the TE library, or one read is split between flank and TE.</text><text x="506" y="243" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#57606a">reference</text><polygon points="580,230 680,230 680,248 580,248" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><polygon points="680,230 810,230 810,248 680,248" fill="#9fdccf" stroke="#1f7a6f" stroke-width="1.2"/><text x="745.0" y="243.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#24292f">TE</text><polygon points="810,230 920,230 920,248 810,248" fill="#e6e9ee" stroke="#9aa3ad" stroke-width="1.2"/><line x1="630" y1="220" x2="662" y2="220" stroke="#24292f" stroke-width="3"/><path d="M661,215 L668,220 L661,225 z" fill="#24292f"/><line x1="826" y1="220" x2="858" y2="220" stroke="#24292f" stroke-width="3"/><path d="M827,215 L820,220 L827,225 z" fill="#24292f"/><path d="M668,220 C700,175 788,175 820,220" fill="none" stroke="#57606a" stroke-width="1.2" stroke-dasharray="2 3"/><line x1="600" y1="204" x2="632" y2="204" stroke="#24292f" stroke-width="3"/><path d="M631,199 L638,204 L631,209 z" fill="#24292f"/><line x1="856" y1="204" x2="888" y2="204" stroke="#24292f" stroke-width="3"/><path d="M857,199 L850,204 L857,209 z" fill="#24292f"/><path d="M638,204 C670,144 818,144 850,204" fill="none" stroke="#57606a" stroke-width="1.2" stroke-dasharray="2 3"/><path d="M638,138 L638,130 L858,130 L858,138" fill="none" stroke="#57606a" stroke-width="1.2"/><text x="748.0" y="124" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#57606a">mates farther apart than the insert size</text><line x1="640" y1="264" x2="680" y2="264" stroke="#24292f" stroke-width="3"/><line x1="680" y1="264" x2="810" y2="264" stroke="#57606a" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="810" y1="264" x2="850" y2="264" stroke="#24292f" stroke-width="3"/><text x="745" y="282" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#57606a">split read: jumps over the TE</text><text x="506" y="310" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#57606a">The two mates of a pair land on either side of the TE, too far</text><text x="506" y="328" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#57606a">apart, or one read is split across it.</text></svg>