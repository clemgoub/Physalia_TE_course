<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         font-size: 16px; line-height: 1.6; color: #24292f; background: #ffffff;
         max-width: 980px; margin: 0 auto; padding: 32px 16px; }
  h1, h2 { border-bottom: 1px solid #d0d7de; padding-bottom: .3em; }
  h1, h2, h3, h4 { margin-top: 24px; margin-bottom: 16px; font-weight: 600; line-height: 1.25; }
  a { color: #0969da; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 85%;
         background: #eff1f3; padding: .2em .4em; border-radius: 6px; }
  pre { background: #f6f8fa; padding: 16px; border-radius: 6px; overflow-x: auto; line-height: 1.45; }
  pre code { background: none; padding: 0; font-size: 85%; }
  pre.mermaid { background: #ffffff; text-align: center; }
  blockquote { margin: 0 0 16px; padding: 0 1em; color: #57606a; border-left: .25em solid #d0d7de; }
  table { border-collapse: collapse; display: block; overflow-x: auto; margin-bottom: 16px; }
  th, td { border: 1px solid #d0d7de; padding: 6px 13px; }
  tr:nth-child(2n) { background: #f6f8fa; }
  img { max-width: 100%; }
  details { margin-bottom: 16px; }
  summary { cursor: pointer; font-weight: 600; }
</style>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>document.addEventListener("DOMContentLoaded", function () { mermaid.initialize({ startOnLoad: true, theme: "default" }); });</script>
